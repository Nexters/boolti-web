name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Check toolchain versions
        run: |
          node --version
          node .yarn/releases/yarn-4.1.0.cjs --version

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.1.0.cjs install --immutable

      - name: Check eslint rule
        run: node .yarn/releases/yarn-4.1.0.cjs lint

      - name: Check typescript type
        run: node .yarn/releases/yarn-4.1.0.cjs type-check

      - name: Build applications
        run: node .yarn/releases/yarn-4.1.0.cjs build --force

      - name: Build Storybook
        run: node .yarn/releases/yarn-4.1.0.cjs workspace stroybook build:storybook
